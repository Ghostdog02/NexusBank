# RDB persistence — snapshot thresholds
save 3600 1
save 300 100
save 60 10000

# Persistence storage
dir /data
dbfilename dump.rdb

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Logging
loglevel warning

# CRITICAL FOR BANKING: Don't block application writes if the disk fills up
stop-writes-on-bgsave-error no

# SECURITY FOR BANKING: Require a password within the Docker network
protected-mode yes
requirepass "generate_a_strong_long_password_here"
