<div
   id="g_id_onload"
   data-client_id=""
   data-context="signin"
   data-ux_mode="popup"
   data-auto_select="true"
   data-login-uri="http://localhost:3000/api/auth/google-login"
   data-itp_support="true"
   data-use_fedcm_for_prompt="true"
></div>
    
<div
   class="g_id_signin"
   data-type="standard"
   data-shape="pill"
   data-theme="filled_black"
   data-text="signin_with"
   data-size="large"
   data-logo_alignment="left"
></div>
